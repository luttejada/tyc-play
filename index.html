        <div class="hud-tags">
          <div class="hud-draft tag pill sig-adv" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="2" /><path d="M10 15V6M6 9.5 10 5.5l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            Rebufo
          </div>
          <div class="hud-drift tag pill" hidden></div>
          <div class="hud-sling tag pill" hidden><span class="hud-sling-name"></span> <span class="hud-sling-stage pips"></span></div>
          <div class="hud-boost tag pill" hidden>Turbo</div>
          <div class="hud-flip tag pill" hidden>Vuelco</div>
          <div class="hud-pull tag pill" hidden></div>
          <div class="hud-heat tag pill" hidden></div>
          <div class="hud-lock tag pill" hidden></div>
          <div class="hud-pit tag pill" hidden>Boxes</div>
        </div>
        <div class="hud-left">
          <div class="hud-syn tag pill" hidden></div>
            <div class="hud-card tag pill" hidden><span class="hud-card-icon"></span><span class="hud-card-kind"></span><span class="hud-card-name"></span></div>
          <div class="hud-zone" hidden>
            <svg class="z-out" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 1.5h7l5 5v7l-5 5h-7l-5-5v-7z" fill="currentColor" /><path d="M7 7l6 6M13 7l-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" /></svg>
            <svg class="z-safe" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7 2.6v5.2c0 4.3-3 7.6-7 9.2-4-1.6-7-4.9-7-9.2V4.1z" fill="currentColor" /><path d="M6.3 10.2l2.5 2.5 4.9-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <b class="hud-zone-text"></b><span class="hud-zone-gap"></span>
          </div>
          <div class="hud-race">
            <div class="hud-place-box panel"><small>Puesto</small><span class="hud-place">1/16</span></div>
            <div class="hud-lap pill" hidden></div>
          </div>
          <div class="hud-speed-box"><svg viewBox="0 0 132 132" aria-hidden="true"><circle class="dial" cx="66" cy="66" r="62" /><g class="hud-gauge-ticks"></g><line class="needle hud-needle" x1="66" y1="66" x2="66" y2="16" /><circle class="hub" cx="66" cy="66" r="6" /></svg><div class="hud-speed-read"><span class="hud-speed">0</span><small>km/h</small></div></div>
        </div>
        </div>
        <div class="hud-lights panel" hidden><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span><span class="hud-lights-text"></span></div>
        <div class="hud-out panel sig-elim" hidden>
          <h2><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 1.5h7l5 5v7l-5 5h-7l-5-5v-7z" fill="none" stroke="currentColor" stroke-width="2" /><path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>Eliminado</h2>
          <div class="hud-out-text"></div>
          <div class="hud-watching"></div>
          <button class="pill menu-back" data-action="menu"></button>
        </div>
        <div class="hud-finish" hidden>
          <div class="panel">
            <h2>Fin de la carrera</h2>
            <div class="hud-finish-place"></div>
            <div class="hud-finish-time">0 s</div>
          </div>
        </div>
        </div>
      <div id="help">
        <div><span class="keys"><kbd>W</kbd><kbd>↑</kbd></span>Acelerar</div>
        <div><span class="keys"><kbd>A</kbd><kbd>D</kbd><kbd>←</kbd><kbd>→</kbd></span>Doblar</div>
        <div><span class="keys"><kbd>S</kbd><kbd>↓</kbd><kbd>Esp</kbd></span>Frenar</div>
        <div><span class="keys"><kbd>S</kbd>+<kbd>A</kbd><kbd>D</kbd></span>Cruzar</div>
        <div><span class="keys"><kbd>Esc</kbd></span>Pausa</div>
      </div>
      <div id="result" hidden>
        <div id="confetti"></div>
        <div class="panel">
          <h2 id="result-title"></h2>
          <div id="result-outcome"></div>
          <div id="result-notes"></div>
          <ol id="result-list"></ol>
          <button id="result-next" class="pill" data-action="next" hidden></button>
          <button id="result-photo" class="pill" data-action="photo" hidden></button>
          <button class="pill menu-back" data-action="menu"></button>
        </div>
      </div>
      <canvas id="showroom" hidden></canvas>
      <div id="menu" class="screen" hidden>
        <div class="logo">
          <h1><span id="menu-title"></span> <small id="menu-title-tag"></small></h1>
          <div class="logo-stripes"><i></i><i></i><i></i><b></b></div>
          <div id="menu-sub" class="logo-sub"></div>
        </div>
        <div class="menu-buttons">
          <button id="menu-run" class="race-btn primary"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /><path d="M5 4h15v10H5z" fill="currentColor" opacity="0.25" /><path d="M5 4h5v5H5zM15 4h5v5h-5zM10 9h5v5h-5z" fill="currentColor" /></svg></span><span class="txt"></span></button>
          <button id="menu-classic" class="race-btn"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="6.5" fill="none" stroke="currentColor" stroke-width="2.2" /><ellipse cx="12" cy="12" rx="4.5" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M12 5.5v3" stroke="currentColor" stroke-width="2.2" /></svg></span><span class="txt"></span><small class="btn-note" id="menu-classic-note"></small></button>
          <button id="menu-garage" class="race-btn small"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l2-6h14l2 6v4H3z" fill="currentColor" opacity="0.3" /><path d="M3 15l2-6h14l2 6v4H3zM3 15h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /><circle cx="7" cy="19" r="2" fill="currentColor" /><circle cx="17" cy="19" r="2" fill="currentColor" /></svg></span><span class="txt"></span></button>
          <button id="menu-run-2" class="race-btn small"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="currentColor" /><circle cx="16.5" cy="8" r="3.4" fill="currentColor" /><path d="M2.5 20c0-3.6 2.5-6 5.5-6s5.5 2.4 5.5 6zM11 20c0-3.6 2.5-6 5.5-6s5.5 2.4 5.5 6z" fill="currentColor" /></svg></span><span class="txt"></span></button>
          <button id="menu-online" class="race-btn small"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2" /><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2" /></svg></span><span class="txt"></span></button>
        </div>
        <div id="menu-corner">
          <div id="menu-level" class="tv-plate"><b class="lvl-n"></b><span class="lvl-bar"><i></i></span><small class="lvl-xp"></small></div>
          <button id="menu-tutorial" class="pill"></button>
          <button id="menu-options" class="pill"></button>
        </div>
        <div id="menu-proto"><span id="menu-proto-tag"></span><small id="menu-proto-note"></small></div>

        <div id="menu-car" class="car-plate" hidden><span class="car-plate-num"></span><span class="car-plate-name"><b></b><small></small></span></div>
      </div>
      <div id="options" class="screen" hidden>
        <div class="options-panel panel">
          <h2 id="options-title"></h2>
          <div class="options-volume"></div>
          <div class="options-list"></div>
          <button id="options-close" class="race-btn small"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H7M12 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span class="txt"></span></button>
        </div>
      </div>
      <div id="howto" class="screen" hidden>
        <h2 id="howto-title"></h2>
        <div class="howto-list"></div>
        <button id="howto-go" class="race-btn"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18M5 4h12l-3 4 3 4H5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" /></svg></span><span class="txt"></span></button>
      </div>
      <div id="pick" class="screen" hidden>
        <h2 id="pick-title"></h2>
        <div id="pick-list"></div>
        <button id="pick-back" class="race-btn small ghost"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H7M12 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span class="txt"></span></button>
      </div>
      <div id="lobby" class="screen" hidden>
        <h2 id="lobby-title"></h2>
        <div id="lobby-choose">
          <button id="lobby-create" class="race-btn"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg></span><span class="txt"></span></button>
          <div class="lobby-join-row"><input id="lobby-code" maxlength="4" autocomplete="off" /><button id="lobby-join" class="race-btn small"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span class="txt"></span></button></div>
        </div>
        <div id="lobby-status"></div>
        <div id="lobby-pick"></div>
        <button id="lobby-run" class="race-btn primary" hidden><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /><path d="M5 4h5v5H5zM15 4h5v5h-5zM10 9h5v5h-5z" fill="currentColor" /></svg></span><span class="txt"></span></button>
        <button id="lobby-back" class="race-btn small ghost"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H7M12 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span class="txt"></span></button>
      </div>
      <div id="rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="18.5" r="1" fill="currentColor" /></svg><span id="rotate-text"></span></div>
      <div id="touch" hidden>
        <button data-control="left" aria-label="Izquierda">&#9664;</button>
        <button data-control="right" aria-label="Derecha">&#9654;</button>
        <button data-control="brake">Freno</button>
      </div>
    </div>
    <div id="wipe"></div>
  </body>
</html>
