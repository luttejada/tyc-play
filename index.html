          <button id="menu-run" class="race-btn primary"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /><path d="M5 4h15v10H5z" fill="currentColor" opacity="0.25" /><path d="M5 4h5v5H5zM15 4h5v5h-5zM10 9h5v5h-5z" fill="currentColor" /></svg></span><span class="txt"></span></button>
          <button id="menu-run-2" class="race-btn"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="currentColor" /><circle cx="16.5" cy="8" r="3.4" fill="currentColor" /><path d="M2.5 20c0-3.6 2.5-6 5.5-6s5.5 2.4 5.5 6zM11 20c0-3.6 2.5-6 5.5-6s5.5 2.4 5.5 6z" fill="currentColor" /></svg></span><span class="txt"></span></button>
          <button id="menu-online" class="race-btn small"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2" /><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2" /></svg></span><span class="txt"></span></button>
        </div>
        <div id="menu-proto"><span id="menu-proto-tag"></span><small id="menu-proto-note"></small></div>
        <div id="menu-sound"></div>
        <div id="menu-car" class="car-plate" hidden><span class="car-plate-num"></span><span class="car-plate-name"><b></b><small></small></span></div>
      </div>
      <div id="pick" class="screen" hidden>
        <h2 id="pick-title"></h2>
        <div id="pick-list"></div>
      </div>
      <div id="lobby" class="screen" hidden>
        <h2 id="lobby-title"></h2>
        <div id="lobby-choose">
          <button id="lobby-create" class="race-btn"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg></span><span class="txt"></span></button>
          <div class="lobby-join-row"><input id="lobby-code" maxlength="4" autocomplete="off" /><button id="lobby-join" class="race-btn small"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span class="txt"></span></button></div>
        </div>
        <div id="lobby-status"></div>
        <div id="lobby-pick"></div>
        <button id="lobby-run" class="race-btn primary" hidden><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /><path d="M5 4h5v5H5zM15 4h5v5h-5zM10 9h5v5h-5z" fill="currentColor" /></svg></span><span class="txt"></span></button>
        <button id="lobby-back" class="race-btn small ghost"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H7M12 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span class="txt"></span></button>
      </div>
      <div id="touch" hidden>
        <button data-control="left" aria-label="Izquierda">&#9664;</button>
        <button data-control="right" aria-label="Derecha">&#9654;</button>
        <button data-control="brake">Freno</button>
      </div>
    </div>
  </body>
</html>
