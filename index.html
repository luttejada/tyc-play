    <title>TYC</title>

    <script type="module" crossorigin src="./assets/index-DF0e_AII.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="fps">-- fps</div>
      <div id="sound-hint" class="pill" hidden></div>
      <div class="view" data-player="0">
        <div class="pit-cards" hidden>
          <div class="pit-title"></div>
          <div class="pit-hint"></div>
          <div class="cards">
            <div class="card panel" data-card="0"><span class="card-kind"></span><span class="card-name"></span><span class="card-text"></span><span class="card-mark"></span></div>
            <div class="card panel" data-card="1"><span class="card-kind"></span><span class="card-name"></span><span class="card-text"></span><span class="card-mark"></span></div>
            <div class="card panel" data-card="2"><span class="card-kind"></span><span class="card-name"></span><span class="card-text"></span><span class="card-mark"></span></div>
          </div>
        </div>
        <div class="hud-own">
        <div class="hud-tags">
          <div class="hud-draft tag pill sig-adv" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="2" /><path d="M10 15V6M6 9.5 10 5.5l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            Rebufo
          </div>
          <div class="hud-drift tag pill" hidden></div>
          <div class="hud-sling tag pill" hidden><span class="hud-sling-name"></span> <span class="hud-sling-stage pips"></span></div>
          <div class="hud-boost tag pill" hidden>Turbo</div>
          <div class="hud-flip tag pill" hidden>Vuelco</div>
          <div class="hud-pull tag pill" hidden></div>
          <div class="hud-heat tag pill" hidden></div>
          <div class="hud-lock tag pill" hidden></div>
          <div class="hud-pit tag pill" hidden>Boxes</div>
        </div>
        <div class="hud-left">
          <div class="hud-card tag pill" hidden><span class="hud-card-icon"></span><span class="hud-card-kind"></span><span class="hud-card-name"></span></div>
          <div class="hud-race">
            <div class="hud-place-box panel"><small>Puesto</small><span class="hud-place">1/16</span></div>
            <div class="hud-zone tag pill" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 1.5h7l5 5v7l-5 5h-7l-5-5v-7z" fill="none" stroke="currentColor" stroke-width="2" /><path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
              <span class="hud-zone-text"></span>
            </div>
          </div>
          <div class="hud-speed-box panel"><span class="hud-speed">0</span><small>km/h</small></div>
        </div>
        </div>
        <div class="hud-lights panel" hidden><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span><span class="hud-lights-text"></span></div>
        <div class="hud-out panel sig-elim" hidden>
          <h2><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 1.5h7l5 5v7l-5 5h-7l-5-5v-7z" fill="none" stroke="currentColor" stroke-width="2" /><path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>Eliminado</h2>
          <div class="hud-out-text"></div>
          <div class="hud-watching"></div>
          <button class="pill menu-back" data-action="menu"></button>
        </div>
        <div class="hud-finish" hidden>
          <div class="panel">
            <h2>Fin de la carrera</h2>
            <div class="hud-finish-place"></div>
            <div class="hud-finish-time">0 s</div>
          </div>
        </div>
        </div>
      <div id="help" class="panel">Flechas o WASD para manejar. Freno: S o espacio. Pegate atrás de otro auto para cargar el chupón y abrite al costado para salir con turbo. Frenar y girar juntos cruza el auto en las curvas cerradas.</div>
      <div id="result" hidden>
        <div class="panel">
          <h2 id="result-title"></h2>
          <div id="result-outcome"></div>
          <ol id="result-list"></ol>
          <button id="result-next" class="pill" data-action="next" hidden></button>
          <button class="pill menu-back" data-action="menu"></button>
        </div>
      </div>
      <div id="menu" hidden>
        <h1 id="menu-title"></h1>
        <div id="menu-proto"><span id="menu-proto-tag"></span><br /><small id="menu-proto-note"></small></div>
        <button id="menu-run" class="pill"></button>
        <button id="menu-run-2" class="pill"></button>
        <button id="menu-online" class="pill"></button>
        <div id="menu-sound"></div>
      </div>
      <div id="pick" hidden>
        <h2 id="pick-title"></h2>
        <div id="pick-list"></div>
      </div>
      <div id="lobby" hidden>
        <div class="panel">
          <h2 id="lobby-title"></h2>
          <div id="lobby-choose">
            <button id="lobby-create" class="pill"></button>
            <div class="lobby-join-row"><input id="lobby-code" maxlength="4" autocomplete="off" /><button id="lobby-join" class="pill"></button></div>
          </div>
          <div id="lobby-status"></div>
          <div id="lobby-pick"></div>
          <button id="lobby-run" class="pill" hidden></button>
          <button id="lobby-back" class="pill menu-back"></button>
        </div>
      </div>
      <div id="touch" hidden>
        <button data-control="left" aria-label="Izquierda">&#9664;</button>
        <button data-control="right" aria-label="Derecha">&#9654;</button>
        <button data-control="brake">Freno</button>
      </div>
    </div>
  </body>
</html>
